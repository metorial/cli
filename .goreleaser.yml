version: 2

project_name: metorial

dist: dist

release:
  github:
    owner: metorial
    name: cli
  draft: false
  replace_existing_draft: true

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: metorial
    main: ./cmd/metorial
    binary: metorial
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/metorial/cli/internal/version.Version={{ .Version }}
      - -X github.com/metorial/cli/internal/version.Commit={{ .Commit }}
      - -X github.com/metorial/cli/internal/version.Date={{ .Date }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

  - id: metorial-admin
    main: ./cmd/metorial-admin
    binary: metorial-admin
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/metorial/cli/internal/version.Version={{ .Version }}
      - -X github.com/metorial/cli/internal/version.Commit={{ .Commit }}
      - -X github.com/metorial/cli/internal/version.Date={{ .Date }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: metorial
    builds:
      - metorial
    name_template: 'metorial_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: metorial-admin
    builds:
      - metorial-admin
    name_template: 'metorial-admin_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

brews:
  - name: metorial
    ids:
      - metorial
    repository:
      owner: metorial
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
      branch: goreleaser-homebrew-{{ .Version }}
      pull_request:
        enabled: true
    directory: Formula
    homepage: https://metorial.com
    description: Official CLI for Metorial integrations and MCP tools
    license: MIT
    commit_author:
      name: metorial-bot
      email: hey@metorial.com
    test: |
      system "#{bin}/metorial", "version"
    install: |
      bin.install "metorial"

  - name: metorial-admin
    ids:
      - metorial-admin
    repository:
      owner: metorial
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
      branch: goreleaser-homebrew-admin-{{ .Version }}
      pull_request:
        enabled: true
    directory: Formula
    homepage: https://metorial.com
    description: Official admin CLI for the Metorial Magnetar API
    license: MIT
    commit_author:
      name: metorial-bot
      email: hey@metorial.com
    test: |
      system "#{bin}/metorial-admin", "version"
    install: |
      bin.install "metorial-admin"

scoops:
  - name: metorial
    ids:
      - metorial
    repository:
      owner: metorial
      name: scoop-bucket
      token: '{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}'
      branch: goreleaser-scoop-{{ .Version }}
      pull_request:
        enabled: true
    homepage: https://metorial.com
    description: Official CLI for Metorial integrations and MCP tools
    license: MIT
    commit_author:
      name: metorial-bot
      email: hey@metorial.com

  - name: metorial-admin
    ids:
      - metorial-admin
    repository:
      owner: metorial
      name: scoop-bucket
      token: '{{ .Env.SCOOP_BUCKET_GITHUB_TOKEN }}'
      branch: goreleaser-scoop-admin-{{ .Version }}
      pull_request:
        enabled: true
    homepage: https://metorial.com
    description: Official admin CLI for the Metorial Magnetar API
    license: MIT
    commit_author:
      name: metorial-bot
      email: hey@metorial.com

changelog:
  sort: asc
  use: git
